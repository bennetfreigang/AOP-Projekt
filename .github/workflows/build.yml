name: Java Build Check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Java 21 (Temurin) setup
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: compiling code
        run: |
          mkdir -p bin
          find src test -name "*.java" > sources.txt
          javac -d bin @sources.txt
      - name: running tests
        run: java -cp bin testing.TestEngine
      - name: Main-Class Smoke-Test
        run: |
          timeout 5 java -cp bin app.Main --headless-test || \
          echo "Hinweis: Main lief entweder erfolgreich durch oder wurde nach 5s beendet (z.B. weil ein GUI-Fenster wartet)."